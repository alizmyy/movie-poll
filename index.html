<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кино-опрос: Что будем смотреть?</title>
    <style>
        /* --- ДИЗАЙН (CSS) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e130c 0%, #9a8478 100%);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 600px;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .preview-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            border: 3px solid #ffcc00;
        }

        h1 {
            color: #ffcc00;
            margin-top: 0;
        }

        .movie-option {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .movie-option:hover {
            background-color: #ffcc00;
            color: black;
            border-color: #ffcc00;
            transform: scale(1.02);
        }

        /* Скрываем экран результатов через CSS */
        #result-screen {
            display: none;
        }

        .winner-title {
            font-size: 28px;
            color: #ffcc00;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: transparent;
            color: #ffcc00;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .reset-btn:hover {
            background-color: #ffcc00;
            color: black;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Экран с опросом -->
        <div id="poll-screen">
            <h1>Что будем смотреть?</h1>
            
            <!-- Превью картинка. Обрати внимание на popcorn.jpg.jpg -->
            <img src="popcorn.jpg.jpg" alt="Кино-вечер" class="preview-img">
            
            <p>Выбери фильм, который ты хочешь посмотреть сегодня вечером:</p>
            
            <button class="movie-option" onclick="vote('Интерстеллар')">Интерстеллар (Sci-Fi)</button>
            <button class="movie-option" onclick="vote('Джон Уик')">Джон Уик (Боевик)</button>
            <button class="movie-option" onclick="vote('Властелин колец')">Властелин колец (Фэнтези)</button>
            <button class="movie-option" onclick="vote('Очень страшное кино')">Очень страшное кино (Комедия)</button>
        </div>

        <!-- Экран с результатами. style="display: none;" скрывает его принудительно -->
        <div id="result-screen" style="display: none;">
            <h2>Голосование завершено!</h2>
            <p>Твой выбор записан.</p>
            <div class="winner-title" id="winner-text">Лучший фильм: ...</div>
            <button class="reset-btn" onclick="resetPoll()">Проголосовать еще раз</button>
        </div>

    </div>

    <!-- --- ЛОГИКА (JavaScript) --- -->
    <script>
        // Объект, где мы будем хранить голоса
        let votes = {
            'Интерстеллар': 0,
            'Джон Уик': 0,
            'Властелин колец': 0,
            'Очень страшное кино': 0
        };

        function vote(movieName) {
            votes[movieName]++;

            document.getElementById('poll-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            let winner = '';
            let maxVotes = -1;

            for (let movie in votes) {
                if (votes[movie] > maxVotes) {
                    maxVotes = votes[movie];
                    winner = movie;
                }
            }

            document.getElementById('winner-text').innerText = `Лучший фильм: ${winner}!`;
        }

        function resetPoll() {
            for (let movie in votes) {
                votes[movie] = 0;
            }
            
            document.getElementById('poll-screen').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
        }
    </script>

</body>
</html>
