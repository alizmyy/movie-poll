<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кино-опрос: Что будем смотреть?</title>
    <style>
        /* --- ДИЗАЙН (CSS) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e130c 0%, #9a8478 100%);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 600px;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .preview-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            border: 3px solid #ffcc00;
        }

        h1 {
            color: #ffcc00;
            margin-top: 0;
        }

        /* Стили для кнопок */
        .movie-option {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left; /* Текст по левому краю для удобства */
            display: flex;
            justify-content: space-between; /* Название слева, счетчик справа */
            align-items: center;
        }

        .movie-option:hover {
            background-color: #ffcc00;
            color: black;
            border-color: #ffcc00;
            transform: scale(1.02);
        }

        .vote-count {
            font-weight: bold;
            background-color: #555;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 16px;
        }

        .movie-option:hover .vote-count {
            background-color: #333;
            color: #ffcc00;
        }

        /* Экран результатов */
        #result-screen {
            display: none;
        }

        .winner-title {
            font-size: 28px;
            color: #ffcc00;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: transparent;
            color: #ffcc00;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .reset-btn:hover {
            background-color: #ffcc00;
            color: black;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Экран с опросом -->
        <div id="poll-screen">
            <h1>Что будем смотреть?</h1>
            
            <img src="popcorn.jpg.jpg" alt="Кино-вечер" class="preview-img">
            
            <p>Выбери фильм, который ты хочешь посмотреть сегодня вечером:</p>
            
            <!-- Кнопки с фильмами (добавил span для вывода голосов) -->
            <button class="movie-option" onclick="vote('Интерстеллар')">
                Интерстеллар (Sci-Fi) <span class="vote-count" id="count-Интерстеллар">0</span>
            </button>
            <button class="movie-option" onclick="vote('Джон Уик')">
                Джон Уик (Боевик) <span class="vote-count" id="count-Джон Уик">0</span>
            </button>
            <button class="movie-option" onclick="vote('Властелин колец')">
                Властелин колец (Фэнтези) <span class="vote-count" id="count-Властелин колец">0</span>
            </button>
            <button class="movie-option" onclick="vote('Очень страшное кино')">
                Очень страшное кино (Комедия) <span class="vote-count" id="count-Очень страшное кино">0</span>
            </button>
        </div>

        <!-- Экран с результатами -->
        <div id="result-screen">
            <h2>Голосование завершено!</h2>
            <p>Твой выбор записан.</p>
            <div class="winner-title" id="winner-text">Лучший фильм: ...</div>
            
            <!-- Блок для вывода статистики по всем фильмам -->
            <div id="all-votes" style="margin-top: 20px; font-size: 18px; line-height: 1.8; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px;"></div>
            
            <button class="reset-btn" onclick="resetPoll()">Проголосовать еще раз</button>
        </div>

    </div>

    <!-- --- ЛОГИКА (JavaScript) --- -->
    <script>
        // ВНИМАНИЕ: Эти данные лучше скрыть перед публикацией!
        const BIN_ID = "6aef25d7ac6210605a7544f3"; 
        const API_KEY = "$2a$10$K4CqcHG4476JUFAC1LfJPuGQqvTlhDSD/LRR4GNMwddf1/rKYSiMe"; 

        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // Функция получения голосов с сервера
        async function getVotes() {
            try {
                const response = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await response.json();
                return data.record; 
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                // Возвращаем нули, если сервер недоступен
                return { 'Интерстеллар': 0, 'Джон Уик': 0, 'Властелин колец': 0, 'Очень страшное кино': 0 };
            }
        }

        // Функция обновления счетчиков на кнопках
        async function updateCounters() {
            const currentVotes = await getVotes();
            for (let movie in currentVotes) {
                const spanId = `count-${movie}`;
                const spanElement = document.getElementById(spanId);
                if (spanElement) {
                    spanElement.innerText = currentVotes[movie];
                }
            }
        }

        // Функция голосования
        async function vote(movieName) {
            let currentVotes = await getVotes();
            currentVotes[movieName]++;

            // Отправляем обновленные данные на сервер
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(currentVotes)
                });
            } catch (error) {
                console.error("Ошибка сохранения:", error);
            }

            // Меняем экраны
            document.getElementById('poll-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            // Ищем победителя
            let winner = '';
            let maxVotes = -1;
            let statsHtml = '';

            for (let movie in currentVotes) {
                // Формируем статистику для экрана результатов
                statsHtml += `<div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                <span>${movie}</span>
                                <span style="color: #ffcc00; font-weight: bold;">${currentVotes[movie]} гол.</span>
                              </div>`;

                // Ищем победителя
                if (currentVotes[movie] > maxVotes) {
                    maxVotes = currentVotes[movie];
                    winner = movie;
                }
            }

            // Выводим победителя и общую статистику
            document.getElementById('winner-text').innerHTML = `Лучший фильм: ${winner}!<br><span style="font-size: 18px; color: white;">(Голосов: ${maxVotes})</span>`;
            document.getElementById('all-votes').innerHTML = statsHtml;
        }

        // Сброс экрана
        function resetPoll() {
            document.getElementById('poll-screen').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
            // Обновляем счетчики на кнопках при возврате
            updateCounters(); 
        }

        // При загрузке страницы сразу загружаем актуальные голоса
        window.onload = function() {
            updateCounters();
        };
    </script>

</body>
</html>
